name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Contract Tests
        working-directory: contracts/notekeeper
        run: cargo test

      - name: Build Contracts
        run: |
          cd contracts/memo_token && cargo build --target wasm32-unknown-unknown --release
          cd ../notekeeper && cargo build --target wasm32-unknown-unknown --release
